<meta charset="utf-8">

{% include seo.html %}

{% if page.citation_fields %}
<meta name="citation_title" content="{{ page.title | escape }}">
{% for name in page.paper_authors %}<meta name="citation_author" content="{{ name | escape }}">
{% endfor %}{% for field in page.citation_fields %}<meta name="citation_{{ field[0] }}" content="{{ field[1] | escape }}">
{% endfor %}<link rel="alternate" type="application/x-bibtex" href="{{ page.citation_bibtex | escape }}">
{% endif %}

<meta name="HandheldFriendly" content="True">
<meta name="MobileOptimized" content="320">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<!-- Preconnect to external resources for faster loading -->
<link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://img.shields.io" crossorigin>
<link rel="dns-prefetch" href="https://scholar.google.com">
<link rel="dns-prefetch" href="https://busuanzi.ibruce.info">

<script>
  document.documentElement.className = document.documentElement.className.replace(/\bno-js\b/g, '') + ' js ';
</script>

<!-- For all browsers -->
<link rel="stylesheet" href="{{ '/assets/css/main.css' | relative_url }}?v={{ include.asset_version }}">

<meta http-equiv="cleartype" content="on">
<base href="{{ '/' | relative_url }}" target="_blank">
